# The control plane runs outside the cluster, so the agent's ClusterIP Service is
# not reachable from it. Whatever implements LoadBalancer on the cluster answers
# that: k3s ships klipper-lb, which binds the port on every node's own address
# and needs nothing installed; a cluster running MetalLB (or a cloud provider)
# hands out a stable VIP instead, which is the better address to put in the
# agent's certificate because it does not move with the pod.
#
# Deliberately NOT an Ingress: the agent terminates TLS itself and the control
# plane pins its certificate (PROTEOS_NODE_CA_FILE, TAV-27), because the channel
# carries the bearer token and per-machine volume keys. An HTTP ingress would
# re-terminate that TLS and break the pin; anything placed in front of this
# Service must pass TCP through untouched.
#
# The agent must therefore hold a certificate whose SAN matches the address the
# control plane dials — the node IP, or the DNS name pointing at it.
apiVersion: v1
kind: Service
metadata:
  name: proteos-cluster-agent
  namespace: proteos-system
spec:
  type: LoadBalancer
  # Local: preserve the control plane's source address and avoid a second hop
  # between nodes. Both klipper and MetalLB steer traffic to a node actually
  # running a replica; with two replicas (agent-env.yaml) that is failover
  # rather than load-balancing, which is all the agent needs.
  #
  # Only needed for a control plane OUTSIDE the cluster. With the app stack in
  # the cluster (deploy/kubernetes/app-stack/) the control plane dials the
  # ClusterIP Service by name and this LoadBalancer can be dropped.
  externalTrafficPolicy: Local
