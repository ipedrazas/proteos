name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# Phase 1 CI: every PR builds + tests the Go control plane (with a real Postgres
# service container and migrations applied), checks sqlc drift, and typechecks +
# builds the web app. CI is green from this phase on; later phases land through it.
jobs:
  controlplane:
    name: control plane (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlplane
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proteos
          POSTGRES_PASSWORD: proteos
          POSTGRES_DB: proteos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proteos -d proteos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://proteos:proteos@localhost:5432/proteos?sslmode=disable
      TEST_DATABASE_URL: postgres://proteos:proteos@localhost:5432/proteos?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - name: sqlc drift check
        run: sqlc diff

      - name: Apply migrations (against service Postgres)
        run: go run ./cmd/controlplane -migrate-only

      # Package binaries run in parallel (no -p 1) and tests within httpapi call
      # t.Parallel(): testutil.Postgres gives every test its own database cloned
      # from a migrated template (pid-scoped names), so nothing is shared even
      # on the single service Postgres — including the down/up migration test,
      # which now mutates only its private clone (TAV-40).
      - name: go test -race
        run: go test -race ./...

  nodeagent:
    name: node-agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodeagent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: nodeagent/go.mod
          # Key the module cache off BOTH sum files: the node-agent carries its
          # own dependencies now (prometheus, and client-go for the kubernetes
          # driver), and the workspace sum alone would miss a change to them.
          cache-dependency-path: |
            go.work.sum
            nodeagent/go.sum

      # The node-agent module builds and tests with no Postgres and no KVM: the
      # dev driver is the default, and the firecracker driver is behind a build
      # tag (exercised only by the self-hosted KVM job below).
      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

      # Firecracker driver unit tests (TAV-40): the state machine runs against
      # the commandRunner seam, so boot/stop/reattach are covered without root
      # or KVM on this ordinary runner. The root+KVM integration tests in the
      # same package skip themselves here (testDriver guards on euid/KVM) and
      # keep running on the self-hosted job below.
      - name: go vet (firecracker tag)
        run: go vet -tags=firecracker ./...

      - name: go test (firecracker driver, unit)
        run: go test -race -tags=firecracker ./internal/driver/firecracker/

  guestagent:
    name: guest agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guestagent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: guestagent/go.mod
          cache-dependency-path: guestagent/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The vsock listener is behind a linux build tag; cross-build it so the
      # production (in-VM) target is checked even though the runner is linux.
      - name: go build (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build ./...

      - name: go test -race
        run: go test -race ./...

  # The OCI guest image (the Kubernetes backend's guest). Built and actually RUN
  # here — verify-guest-image.sh boots it the way a machine pod does and checks
  # /healthz, dir-mode persistence, a real terminal WebSocket + PTY round-trip,
  # the port-preview forward, and the baked platform layer. That is the OCI
  # replacement for the ext4 image's loop-mount verifiers, which cannot run on a
  # container image. Build only; the publish job pushes.
  guest-image:
    name: guest image (OCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the base guest image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: image/guest.Dockerfile
          build-args: |
            TEMPLATE=base
            GUESTAGENT_VERSION=ga-${{ github.sha }}
          load: true
          tags: proteos-guest:base-ci
          cache-from: type=gha,scope=proteos-guest-base
          cache-to: type=gha,mode=max,scope=proteos-guest-base

      - name: Verify the guest image
        run: image/verify-guest-image.sh --image proteos-guest:base-ci

  # The Kubernetes backend against a REAL cluster. The kubernetes driver's unit
  # tests run against client-go's fake clientset, which is a plain object store:
  # it cannot schedule a pod, bind a PVC, pull an image, run a readiness probe or
  # route a packet. This job applies the shipping manifests to a kind cluster and
  # drives a machine through its lifecycle, which is the only way those parts get
  # exercised at all.
  #
  # FUNCTIONAL, not isolation: kind has no gVisor, so the kind overlay disables
  # the RuntimeClass. This job says nothing about the sandbox a production
  # deployment relies on (SECURITY.md); it says the driver drives Kubernetes.
  kubernetes-e2e:
    name: kubernetes backend (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The guest image is ~2.7 GB (Ubuntu + Node + code-server + Claude), and
      # `kind load docker-image` writes it out as a tar and then imports it into
      # the node's containerd — so the job needs roughly three copies on disk at
      # once. A stock runner does not have that spare, and the failure mode is an
      # unhelpful "no space left on device" from `docker save`. Reclaim the
      # preinstalled toolchains we do not use.
      #
      # Runs BEFORE setup-go: the Go toolchain lands in the hosted tool cache,
      # which is why that directory is deliberately left alone.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "after reclaim:"
          df -h / | tail -1

      - uses: actions/setup-go@v7
        with:
          go-version-file: nodeagent/go.mod
          cache-dependency-path: |
            go.work.sum
            nodeagent/go.sum

      # install_only: the script creates and tears down its own cluster, so the
      # action must not create one.
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run the kind e2e
        run: deploy/kubernetes/e2e-kind.sh

  # Firecracker integration tests run the real jailed VMM and need KVM, so they
  # only run on a self-hosted runner with the [self-hosted, linux, kvm] labels.
  # The runner must have firecracker+jailer installed and the pinned kernel/rootfs
  # exported via the PROTEOS_TEST_* env below.
  #
  # Gated on the HAS_KVM_RUNNER repository variable: with no matching runner
  # registered the job would otherwise queue for 24h and fail on every push/PR.
  # Self-hosted runners on a public repo are also a security risk (fork PRs can
  # run arbitrary code on them) — before flipping the variable to "true",
  # restrict the runner to a runner group that requires workflow approval.
  firecracker:
    name: firecracker driver (KVM)
    if: vars.HAS_KVM_RUNNER == 'true'
    runs-on: [self-hosted, linux, kvm]
    defaults:
      run:
        working-directory: nodeagent
    env:
      PROTEOS_TEST_KERNEL: ${{ vars.PROTEOS_TEST_KERNEL }}
      PROTEOS_TEST_ROOTFS: ${{ vars.PROTEOS_TEST_ROOTFS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: nodeagent/go.mod
          cache-dependency-path: go.work.sum

      - name: go build (firecracker tag)
        run: go build -tags=firecracker ./...

      # Root is required for the jailer + tap/nftables setup; the self-hosted
      # runner is configured to allow sudo -E for the test step.
      - name: go test (firecracker integration)
        run: sudo -E env "PATH=$PATH" go test -tags=firecracker ./internal/driver/firecracker/...

  web:
    name: web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      # `npm audit` exits 1 for two very different things: "found high/critical
      # vulnerabilities" and "could not reach the audit endpoint". npm's endpoint
      # fails often enough that the second has blocked PRs that changed no
      # JavaScript at all. So: enforce a real report, and treat the absence of
      # one as a warning — a registry outage is not a finding about this repo.
      - name: npm audit
        run: |
          set +e
          report="$(npm audit --json 2>/tmp/npm-audit.err)"
          set -e
          if ! printf '%s' "$report" | grep -q '"auditReportVersion"'; then
            echo "::warning title=npm audit skipped::npm produced no audit report (registry or endpoint error); not failing the build"
            cat /tmp/npm-audit.err || true
            exit 0
          fi
          printf '%s' "$report" | node -e '
            let raw = "";
            process.stdin.on("data", c => (raw += c)).on("end", () => {
              const report = JSON.parse(raw);
              const counts = (report.metadata && report.metadata.vulnerabilities) || {};
              console.log("npm audit:", JSON.stringify(counts));
              const blocking = Object.entries(report.vulnerabilities || {})
                .filter(([, v]) => v.severity === "high" || v.severity === "critical");
              if (blocking.length === 0) process.exit(0);
              console.log("\nHigh/critical:");
              for (const [name, v] of blocking) {
                console.log("  " + v.severity + "  " + name + "  " + (v.range || ""));
              }
              console.log("\nFix with `npm audit fix`, or `npm update <pkg>` when audit fix");
              console.log("reports a fix as available but changes nothing.");
              process.exit(1);
            });
          '

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # E2E smoke (TAV-40): build the production controlplane + web images from this
  # checkout, boot the minimal Postgres + API + SPA stack, and probe it —
  # migrations apply, /healthz answers, nginx serves the SPA, and the /api
  # reverse proxy reaches the control plane. This is the only place the shipped
  # Dockerfiles + nginx.conf are exercised before the publish job bakes them.
  smoke:
    name: e2e smoke (app stack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build, boot, probe, tear down
        run: deploy/app-stack/smoke.sh

  # govulncheck scans the Go modules for known CVEs. govulncheck is module-scoped
  # (it needs a go.mod in the working directory — the workspace root has only a
  # go.work, hence the per-module matrix). cli and nodeagent have no external deps,
  # so their scans are effectively no-ops but keep coverage honest as deps are added.
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [controlplane, guestagent, nodeagent, cli]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: go.work.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  # CodeQL static analysis for Go (all workspace modules) and TypeScript (web/).
  # Requires security-events: write to upload SARIF results to the Security tab.
  #
  # Gated on the repository being public, because uploading those results is
  # code scanning, and code scanning on a PRIVATE repo needs GitHub Advanced
  # Security — Enterprise Cloud or a paid Code Security add-on, neither of which
  # a free-plan org has. It is free for public repos only. While proteos is
  # private this job cannot pass: the analysis itself runs fine and finds
  # nothing, then the upload fails with "Advanced Security must be enabled for
  # this repository to use code scanning".
  #
  # Skipping is deliberately preferred over continue-on-error (which would
  # report a misleading near-green for a job that never uploads) and over
  # deleting the job (which would lose the config). Written as a visibility
  # check rather than a hardcoded disable so it starts running by itself the day
  # the repo goes public — nothing to remember.
  codeql:
    if: github.event.repository.visibility == 'public'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: go.work.sum

      - name: Set up Node
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: matrix.language == 'typescript'
        run: npm ci
        working-directory: web

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Build + push the two app-stack images to GHCR, but ONLY after the Go and web
  # jobs above pass (`needs`) and ONLY on push events (`if`) — never on PRs, so
  # forks/PRs can't publish. Pushes to main publish `latest`; v* tag pushes
  # publish semver tags. The firecracker job is intentionally NOT a dependency:
  # it requires a self-hosted KVM runner and may not be available in every environment.
  #
  # Both Dockerfiles take the REPO ROOT as their build context — the control
  # plane links sibling Go-workspace modules, and the web image needs both web/
  # and deploy/app-stack/nginx.conf — so `context: .` is required, not the
  # Dockerfile's directory.
  publish:
    name: publish ${{ matrix.image }}
    needs: [controlplane, nodeagent, guestagent, guest-image, kubernetes-e2e, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR via GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: proteos-api
            dockerfile: deploy/app-stack/controlplane.Dockerfile
          - image: proteos-ui
            dockerfile: deploy/app-stack/web.Dockerfile
          # The cluster-agent: a node-agent running the kubernetes driver,
          # deployed inside the target cluster (deploy/kubernetes/).
          - image: proteos-node-agent
            dockerfile: deploy/node-agent/node-agent.Dockerfile
          # The Kubernetes backend's guest image. The image is per-TEMPLATE, and
          # only `base` is published automatically so far — so the tags this job
          # produces (latest, sha-…) all mean the base template. Publishing the
          # other templates means adding matrix entries with distinct tags.
          - image: proteos-guest
            dockerfile: image/guest.Dockerfile
            build-args: |
              TEMPLATE=base
              GUESTAGENT_VERSION=ga-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` on the default branch, the short+long commit SHA always,
      # and semver tags (1.2.3 / 1.2) when the push is a v* git tag.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tavon-ai/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
